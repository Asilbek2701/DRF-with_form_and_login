<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ post.title }}</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            padding: 40px;
        }

        h1 {
            font-size: 36px;
            color: #222;
            margin-bottom: 20px;
        }

        p {
            font-size: 18px;
            line-height: 1.6;
            color: #333;
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        small {
            color: #777;
            display: block;
            margin-top: 15px;
            font-size: 14px;
        }

        h4 {
            margin-top: 10px;
            color: #444;
            font-size: 18px;
        }
    </style>
</head>
<body>

<h1><strong>{{ post.title }}</strong></h1>
<p>{{ post.content }}</p>
<small>{{ post.date }}</small>
<h4>{{ post.author }}</h4>

</body>
</html>
